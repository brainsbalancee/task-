# Optional: the Elasticsearch backend.
#
# The app runs on SQLite + FTS5 out of the box and needs none of this. Start
# this only to exercise the second search engine:
#
#   npm run es:up                       # start Elasticsearch
#   npm run ingest --workspace backend -- --elastic
#   SEARCH_ENGINE=elastic npm run dev
#
# Single node, security disabled — a local development target, not a production
# configuration.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: task-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - '9200:9200'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - es-data:/usr/share/elasticsearch/data

volumes:
  es-data:
